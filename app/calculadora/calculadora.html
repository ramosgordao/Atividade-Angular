<div class="card">
  <h2>Calculadora de IMC</h2>

  <label>Peso (kg):</label>

  <input
    type="number"
    [(ngModel)]="peso"
  >

  <label>Altura (m):</label>

  <input
    type="number"
    step="0.01"
    [(ngModel)]="altura"
  >

  <button (click)="calcular()">
    Calcular
  </button>

  @if (imc !== null) {

    <div class="resultado">

      <p>
        <strong>IMC:</strong>
        {{ imc | number:'1.2-2' }}
      </p>

      <p>
        <strong>Classificação:</strong>
        {{ classificacao }}
      </p>

    </div>
  }
</div>
